name: Formula tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this repository
        run: brew tap brohan2001/tap "$GITHUB_WORKSPACE" || true
      - uses: actions/checkout@v4
      - name: Install from source
        run: brew install --build-from-source brohan2001/tap/fileshift
      - name: Test
        run: brew test brohan2001/tap/fileshift
      - name: Audit
        run: brew audit --strict brohan2001/tap/fileshift
